<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delete Employee</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #dc2626;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 25px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 10px;
            color: #555;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>⚠️ Delete Employee</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ employee.name }}</strong>?
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit" class="delete-btn">
            Yes, Delete
        </button>

        <a href="{% url 'employee_list' %}"
           class="cancel">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
