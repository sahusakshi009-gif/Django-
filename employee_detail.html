<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Details</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        .row {
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .edit {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back {
            display: inline-block;
            margin-left: 10px;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>👨‍💼 Employee Details</h1>

    <div class="row">
        <span class="label">ID:</span>
        {{ employee.id }}
    </div>

    <div class="row">
        <span class="label">Name:</span>
        {{ employee.name }}
    </div>

    <div class="row">
        <span class="label">Email:</span>
        {{ employee.email }}
    </div>

    <div class="row">
        <span class="label">Phone:</span>
        {{ employee.phone }}
    </div>

    <div class="row">
        <span class="label">Department:</span>
        {{ employee.department }}
    </div>

    <div class="row">
        <span class="label">Salary:</span>
        ₹ {{ employee.salary }}
    </div>

    <a href="{% url 'employee_update' employee.id %}"
       class="edit">
        Edit Employee
    </a>

    <a href="{% url 'employee_list' %}"
       class="back">
        Back to List
    </a>

</div>

</body>

</html>
